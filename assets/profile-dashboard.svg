<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Al Prince Llavan — full-stack product engineer</title>
  <desc id="desc">A polished dark blue developer banner introducing Al Prince Llavan and his focus on product engineering, scalable systems, and AI-enabled workflows.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="0.55" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#0c1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57a6ff"/>
      <stop offset="0.52" stop-color="#6c7cff"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f33" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1525" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2d8cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2d8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#22405f" stroke-width="1" stroke-opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000812" flood-opacity="0.54"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .white { fill: #f5f8ff; }
      .body { fill: #b9c8dc; }
      .muted { fill: #7f94af; }
      .blue { fill: #63a9ff; }
      .violet { fill: #a98bff; }
      .green { fill: #4ade9a; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <ellipse cx="160" cy="105" rx="360" ry="280" fill="url(#glowBlue)"/>
  <ellipse cx="1050" cy="410" rx="330" ry="260" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#24415e"/>

  <g opacity="0.55">
    <path d="M0 382H182L218 346H390" fill="none" stroke="#285075"/>
    <circle cx="218" cy="346" r="4" fill="#56a7ff"/>
    <path d="M1030 24v55l-35 35v66" fill="none" stroke="#3a4675"/>
    <circle cx="995" cy="114" r="4" fill="#9b7cff"/>
  </g>

  <g class="sans">
    <g transform="translate(58 54)">
      <circle cx="7" cy="7" r="6" fill="#40d998"/>
      <circle cx="7" cy="7" r="10" fill="none" stroke="#40d998" stroke-opacity="0.25"/>
      <text x="27" y="12" class="green" font-size="13" font-weight="700" letter-spacing="2">FULL-STACK PRODUCT ENGINEER</text>
    </g>

    <text x="58" y="142" class="white" font-size="54" font-weight="760" letter-spacing="-1.6">Al Prince Llavan</text>
    <rect x="58" y="163" width="492" height="4" rx="2" fill="url(#accent)"/>

    <text x="58" y="216" class="white" font-size="25" font-weight="600">I build thoughtful software that scales.</text>
    <text x="58" y="254" class="body" font-size="17">Product-minded interfaces, reliable APIs, and practical AI workflows —</text>
    <text x="58" y="281" class="body" font-size="17">designed clearly and shipped with care.</text>

    <g transform="translate(58 319)">
      <rect width="154" height="39" rx="19.5" fill="#10243a" stroke="#285078"/>
      <circle cx="21" cy="19.5" r="5" fill="#57a6ff"/>
      <text x="36" y="25" class="body" font-size="13" font-weight="600">Product systems</text>

      <g transform="translate(166)">
        <rect width="146" height="39" rx="19.5" fill="#151f3a" stroke="#414d82"/>
        <circle cx="21" cy="19.5" r="5" fill="#9a7cff"/>
        <text x="36" y="25" class="body" font-size="13" font-weight="600">AI workflows</text>
      </g>

      <g transform="translate(324)">
        <rect width="150" height="39" rx="19.5" fill="#102c2b" stroke="#286258"/>
        <circle cx="21" cy="19.5" r="5" fill="#45d99a"/>
        <text x="36" y="25" class="body" font-size="13" font-weight="600">Reliable delivery</text>
      </g>
    </g>

    <text x="58" y="414" class="muted" font-size="13" letter-spacing="1.6">PHILIPPINES  /  BUILDING FOR THE WEB  /  ALWAYS LEARNING</text>
  </g>

  <g transform="translate(716 60)" filter="url(#shadow)">
    <rect width="426" height="332" rx="17" fill="url(#card)" stroke="#29435f"/>
    <rect width="426" height="48" rx="17" fill="#0f1c2e"/>
    <path d="M0 48H426" stroke="#263b54"/>
    <circle cx="24" cy="24" r="5" fill="#ff6b72"/>
    <circle cx="43" cy="24" r="5" fill="#f6c653"/>
    <circle cx="62" cy="24" r="5" fill="#45d991"/>
    <text x="213" y="29" text-anchor="middle" class="mono muted" font-size="12">about.ts</text>

    <g class="mono" font-size="14">
      <text x="28" y="86" class="violet">const</text>
      <text x="78" y="86" class="blue">engineer</text>
      <text x="151" y="86" class="body">= {</text>

      <text x="46" y="120" class="body">name:</text>
      <text x="98" y="120" fill="#f5c46b">"Al Prince"</text>
      <text x="190" y="120" class="body">,</text>

      <text x="46" y="153" class="body">craft:</text>
      <text x="108" y="153" fill="#f5c46b">"end-to-end products"</text>
      <text x="292" y="153" class="body">,</text>

      <text x="46" y="186" class="body">focus:</text>
      <text x="108" y="186" class="body">[</text>
      <text x="120" y="186" fill="#f5c46b">"UX"</text>
      <text x="154" y="186" class="body">,</text>
      <text x="167" y="186" fill="#f5c46b">"systems"</text>
      <text x="243" y="186" class="body">,</text>
      <text x="256" y="186" fill="#f5c46b">"AI"</text>
      <text x="289" y="186" class="body">],</text>

      <text x="46" y="219" class="body">principle:</text>
      <text x="135" y="219" fill="#f5c46b">"clarity over noise"</text>
      <text x="302" y="219" class="body">,</text>

      <text x="46" y="252" class="body">status:</text>
      <text x="116" y="252" class="green">"building"</text>
      <text x="202" y="252" class="body">,</text>

      <text x="28" y="285" class="body">} satisfies</text>
      <text x="130" y="285" class="blue">CuriousBuilder</text>
      <text x="258" y="285" class="body">;</text>
    </g>

    <rect x="28" y="306" width="370" height="2" rx="1" fill="#1f344d"/>
    <rect x="28" y="306" width="252" height="2" rx="1" fill="url(#accent)"/>
  </g>
</svg>
